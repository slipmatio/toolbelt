name: Publish

on:
  workflow_run:
    workflows: ['Tests']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: |
          pnpm i --frozen-lockfile
          pnpm test --run
          pnpm build

      - name: Publish to npm
        id: npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm"
            commit="$(npm view "$name@$version" gitHead)"
          else
            npm publish --provenance --access public
            commit="$(git rev-parse HEAD)"
          fi
          test -n "$commit"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.npm.outputs.tag }}
          tag: ${{ steps.npm.outputs.tag }}
          commit: ${{ steps.npm.outputs.commit }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
          body: |
            Read more from the Changelog: https://github.com/slipmatio/toolbelt/blob/main/CHANGES.md
