name: Publish

on:
  workflow_run:
    workflows: ['Tests']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: |
          pnpm i --frozen-lockfile
          pnpm test --run
          pnpm build

      - name: Read release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          node -e 'const p = require("./package.json"); console.log(`name=${p.name}\nversion=${p.version}\ntag=v${p.version}`)' >> "$GITHUB_OUTPUT"
          tag="v$(node -p 'require("./package.json").version')"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse "refs/tags/$tag^{commit}")" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            published_commit="$(npm view "$(node -p 'require("./package.json").name')@${tag#v}" gitHead --registry=https://registry.npmjs.org 2>/dev/null || true)"
            echo "commit=${published_commit:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          fi

      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        if: steps.version.outputs.commit == github.sha
        with:
          registry: https://registry.npmjs.org
          access: public
          provenance: true

      - name: Verify npm publication
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          for attempt in $(seq 1 40); do
            if published_commit="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead --registry=https://registry.npmjs.org)"; then
              break
            fi
            sleep 15
          done
          if [ "$published_commit" != "$RELEASE_COMMIT" ]; then
            echo '::error::npm publication is missing or points to a different commit. Do not reuse a published version.'
            exit 1
          fi
          echo "Verified $PACKAGE_NAME@$PACKAGE_VERSION on npm at $published_commit"

      - name: Create Tag
        if: steps.version.outputs.tag_exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Verify Tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"

      - name: Generate Changelog
        id: changelog
        uses: jaywcjlove/changelog-generator@00eecde44f40feee4b5c96fe16e5cfdeab76336a # v2.4.0
        with:
          base-ref: ${{ steps.version.outputs.base }}
          head-ref: ${{ steps.version.outputs.commit }}
          filter-author: (Uninen|renovate-bot)
          show-emoji: false

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skipIfReleaseExists: true
          name: ${{ steps.version.outputs.tag }}
          tag: ${{ steps.version.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            Compare changes: https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.base }}...${{ steps.version.outputs.tag }}

            Read more from the Changelog: https://github.com/slipmatio/toolbelt/blob/main/CHANGES.md
